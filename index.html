<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky-View</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <aside class="sidebar">
        <header class="aside">
            <img src="" alt="logo" class="logo">
            <h2 class="sidebarheading">SkyView</h2>
        </header>
        <nav class="navbar">
            <ul class="items">
                <li>
                    <img src="" alt="Home" class="logo1">
                    <h3>Home</h3>
                </li>
                <li>
                    <img src="" alt="Search" class="logo1">
                    <h3>Search</h3>
                </li>
                <li>
                    <img src="" alt="Map" class="logo1">
                    <h3>Map</h3>
                </li>
                <li>
                    <img src="" alt="Favorites" class="logo1">
                    <h3>Favorites</h3>
                </li>
                <li>
                    <img src="" alt="Settings" class="logo1">
                    <h3>Settings</h3>
                </li>
            </ul>
        </nav>
        <footer class="bottomsidebar">
            <img src="" alt="FooterImage" class="footerimage">
        </footer>
    </aside>
    <main class="workSpace">
        <header class="workSpaceheader">
            <div class="leftside">
                <input type="text" placeholder="Search the Location" class="searchBar">
            </div>
            <div class="rightside">
                <img src="" alt="location" class="logo2">
                <img src="" alt="theme" class="logo2">
                <img src="" alt="profile" class="logo1">
            </div>
        </header>
        <section class="sec1">
            <div class="box1">

            </div>
            <div class="box2">

            </div>
        </section>
        <section class="sec2">
            <div class="box1">

            </div>
            <div class="box2">

            </div>
        </section>
        <section class="sec3">
            <div class="box1">
                <h4>7 day forecast</h4>
                <div class="days">
                    <h5 class="dayname">
                        Mon
                    </h5>
                </div>
                <div class="days">
                    <h5 class="dayname">
                        Tue
                    </h5>
                </div>
                <div class="days">
                    <h5 class="dayname">
                        Wed
                    </h5>
                </div>
                <div class="days">
                    <h5 class="dayname">
                        Thu
                    </h5>
                </div>
                <div class="days">
                    <h5 class="dayname">
                        Fri
                    </h5>
                </div>
                <div class="days">
                    <h5 class="dayname">
                        Sat
                    </h5>
                </div>
                <div class="days">
                    <h5 class="dayname">
                        Sun
                    </h5>
                </div>
            </div>
            <div class="box2">

            </div>
        </section>
    </main>
</body>
</html>
